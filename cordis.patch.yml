- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # 0.2.1 起 {{cwd}} 不再是已注册的提示词变量（只剩 provider / model，
    # 由 dsh-agent-loop 注册）。留着会在组装 deployment:persona-suffix 时抛
    # unknown prompt variable "{{cwd}}"，整轮对话直接失败。
    personaSuffix: ""
- insert:
    - id: dsh-purge
      name: 'dsh-purge'
      config:
        enabled: true
        autoApplyOnStart: true
        autoUpdateOnStart: true
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: true
        continueMax: 3
        continueText: "继续"
